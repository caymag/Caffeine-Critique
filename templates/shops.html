<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caffeine Critique - Shops</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Staatliches&display=swap" rel="stylesheet" />
  </head>
  <body>
    <h1 id="header"><span>Caffeine Critique</span></h1>
    <hr />
    <form class="form shops_filter" action="/shops" method="GET">
      <div class="form_field">
        <label for="city" class="form_label">City</label>
        <select name="city" id="city" class="form_input form_select">
          <option value="">All cities</option>
          {% for c in cities %}
          <option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form_field">
        <label for="sort" class="form_label">Sort</label>
        <select name="sort" id="sort" class="form_input form_select">
          <option value="desc" {% if sort != 'asc' %}selected{% endif %}>Rating: high to low</option>
          <option value="asc" {% if sort == 'asc' %}selected{% endif %}>Rating: low to high</option>
        </select>
      </div>
      <div class="form_field">
        <input class="form_submit" type="submit" value="Filter🫘" />
      </div>
    </form>
    <p>{{ shops|length }} shops</p>
    <table class="shops_table">
      <thead>
        <tr><th>Shop</th><th>Location</th><th>Rating</th></tr>
      </thead>
      <tbody>
        {% for shop in shops %}
        <tr><td>{{ shop['file name'] }}</td><td>{{ shop.location }}</td><td>{{ '%g' % shop.rating }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <br />
    <div class="footer">
      <p>
        <a href="/">Predict a Rating</a> &nbsp;|&nbsp;
        <a href="https://github.com/caymag" target="_blank"> Github</a> &nbsp;|&nbsp;
        <a href="https://linkedin.com/in/cayden-maguire" target="_blank">Linkedin</a>
      </p>
    </div>
  </body>
</html>
